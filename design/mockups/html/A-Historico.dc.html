<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Histórico · Sinal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050608}
a{color:#FFB020;text-decoration:none}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; padding: 60px 20px 34px; background: #050608; color: #F3F5F7; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; gap: 12px; height: 56px">
    <a href="A-Home.dc.html" aria-label="Voltar" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 50%; background: #0E1014; border: 1px solid #232832; display: flex; align-items: center; justify-content: center; color: #F3F5F7"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">Histórico</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="height: 92px; box-sizing: border-box; padding: 12px; border-radius: 20px; background: #0E1014; border: 1px solid #232832; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; color: #9AA3AF">partidas</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.9">23</span></div>
    <div style="height: 92px; box-sizing: border-box; padding: 12px; border-radius: 20px; background: #0E1014; border: 1px solid #232832; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; color: #9AA3AF">tempo médio</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.9">41′</span></div>
    <div style="height: 92px; box-sizing: border-box; padding: 12px; border-radius: 20px; background: #1F1806; border: 1px solid #FFB020; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; color: #FFD27A">mais vitórias</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 34px; line-height: 0.9">ANA · 9</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 22px; background: #0E1014; border: 1px solid #232832">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #9AA3AF">FORMATOS</div>
    <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 28px; gap: 8px 10px; align-items: center; font-size: 14px">
      <span>Commander</span><div style="height: 12px; border-radius: 6px; background: #FFB020; width: 100%"></div><span style="text-align: right; font-weight: 600">14</span>
      <span>Standard</span><div style="height: 12px; border-radius: 6px; background: #FFB020; width: 43%"></div><span style="text-align: right; font-weight: 600">6</span>
      <span>Pauper</span><div style="height: 12px; border-radius: 6px; background: #FFB020; width: 21%"></div><span style="text-align: right; font-weight: 600">3</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 22px; background: #0E1014; border: 1px solid #232832">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #9AA3AF">VITÓRIAS POR JOGADOR</div>
    <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 28px; gap: 8px 10px; align-items: center; font-size: 14px">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FFB020"></span>Ana</span><div style="height: 12px; border-radius: 6px; background: #FFB020; width: 100%"></div><span style="text-align: right; font-weight: 600">9</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #22C7F0"></span>Bruno</span><div style="height: 12px; border-radius: 6px; background: #22C7F0; width: 67%"></div><span style="text-align: right; font-weight: 600">6</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #9BE15D"></span>Davi</span><div style="height: 12px; border-radius: 6px; background: #9BE15D; width: 56%"></div><span style="text-align: right; font-weight: 600">5</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FF4F8B"></span>Carla</span><div style="height: 12px; border-radius: 6px; background: #FF4F8B; width: 33%"></div><span style="text-align: right; font-weight: 600">3</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #9AA3AF">ÚLTIMAS PARTIDAS</span><span style="font-size: 12px; color: #7C8593">grátis: últimas 20</span></div>
    <sc-for list="{{games}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; height: 68px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; background: #0E1014; border: 1px solid #232832">
        <div style="display: flex; gap: 3px">
          <sc-for list="{{g.dots}}" as="d" hint-placeholder-count="4"><div style="width: 6px; height: 32px; border-radius: 3px; background: {{d}}"></div></sc-for>
        </div>
        <div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 600">{{g.winner}} venceu</span><span style="font-size: 12px; color: #9AA3AF">{{g.meta}}</span></div>
        <span style="font-size: 12px; color: #9AA3AF">{{g.date}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    var A = '#FFB020', B = '#22C7F0', C = '#FF4F8B', D = '#9BE15D';
    return {
      games: [
        { winner: 'Ana', meta: 'Commander · 4J · 48 min · 11 rodadas', date: 'hoje', dots: [A, B, C, D] },
        { winner: 'Bruno', meta: 'Standard · 2J · 22 min', date: 'ontem', dots: [B, A] },
        { winner: 'Davi', meta: 'Commander · 3J · 63 min', date: '27 set', dots: [D, A, C] },
        { winner: 'Ana', meta: 'Pauper · 2J · 18 min', date: '25 set', dots: [A, C] }
      ]
    };
  }
}
</script>
</body>
</html>
