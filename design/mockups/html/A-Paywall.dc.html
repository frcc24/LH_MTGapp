<x-dc>
<helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 60px 20px 34px; background: #050608; color: #F3F5F7; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">

      <rect width="100" height="100" rx="22" fill="#0E1014"></rect>

  <div style="position: relative; display: flex; flex-direction: column; gap: 4px; padding: 8px 16px; border-radius: 22px; background: #0E1014; border: 1px solid #232832">
    <sc-for list="{{perks}}" as="p" hint-placeholder-count="6">

        <span style="font-size: 12px; color: #7C8593">{{p.free}}</span>
      </div>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="position: relative; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 64px; border-radius: 32px; border: none; background: #FFB020; color: #1A1204; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Comprar por [PREÇO DA LOJA]</button>
