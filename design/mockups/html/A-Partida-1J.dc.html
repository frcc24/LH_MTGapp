<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Partida · solo · Sinal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050608}
a{color:#FFB020;text-decoration:none}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 12px 30px; background: #050608; color: #F3F5F7; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px">
    <a href="A-Home.dc.html" aria-label="Menu da partida" style="width: 56px; height: 56px; box-sizing: border-box; border-radius: 50%; border: 2px solid #2C323C; color: #FFB020; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9.5 21l1-11h3l1 11M8 21h8M10.5 10V7.5L12 6l1.5 1.5V10"></path><path d="M16 7.5l4-1.5M16 9.5l4 1.5M8 7.5L4 6M8 9.5L4 11"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 12px; color: #9AA3AF; letter-spacing: 0.1em; font-weight: 600">GOLDFISH · STANDARD</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">TURNO {{turn}}</span></div>
    <button aria-label="Desfazer" onClick="{{undo}}" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #232832; background: #0E1014; color: #F3F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
  </div>

  <div style="position: relative; flex-grow: 1; overflow: hidden; box-sizing: border-box; border-radius: 32px; border: 2px solid #FFB020; background: radial-gradient(circle at 50% 45%, #FFB02022, #0B0D11 70%); box-shadow: 0 0 0 3px #FFB02044, 0 0 40px #FFB02055">
    <button aria-label="Perder 1 de vida" onClick="{{dec}}" style="position: absolute; left: 0; top: 0; width: 50%; height: 100%; border: none; background: transparent; color: #6B7480; display: flex; align-items: center; padding-left: 22px; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
    <button aria-label="Ganhar 1 de vida" onClick="{{inc}}" style="position: absolute; right: 0; top: 0; width: 50%; height: 100%; border: none; background: transparent; color: #6B7480; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
    <div style="position: absolute; left: 0; right: 0; top: 28px; display: flex; justify-content: center; height: 44px; pointer-events: none">
      <sc-if value="{{hasDelta}}" hint-placeholder-val="{{ false }}"><div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; color: {{deltaColor}}">{{deltaText}}</div></sc-if>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-56%); display: flex; justify-content: center; pointer-events: none">
      <div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 250px; line-height: 0.85; font-variant-numeric: tabular-nums; text-shadow: 0 0 44px #FFB02055">{{life}}</div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; gap: 8px">
      <button onClick="{{m5}}" style="height: 48px; padding: 0 18px; border-radius: 24px; border: 1px solid #2C323C; background: #161A20; color: #F3F5F7; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 22px; cursor: pointer">−5</button>
      <button style="height: 48px; padding: 0 18px; border-radius: 24px; border: 1px solid #2C323C; background: #161A20; color: #F3F5F7; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Digitar</button>
      <button onClick="{{p5}}" style="height: 48px; padding: 0 18px; border-radius: 24px; border: 1px solid #2C323C; background: #161A20; color: #F3F5F7; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 22px; cursor: pointer">+5</button>
    </div>
  </div>

  <div style="display: flex; gap: 8px">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 18px; background: #0E1014; border: 1px solid #232832"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE15D" stroke-width="2" aria-hidden="true"><path d="M12 3a7 7 0 0 0-7 7c0 2.5 1.3 4 3 5v3h8v-3c1.7-1 3-2.5 3-5a7 7 0 0 0-7-7z"></path></svg><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">0</span></div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 18px; background: #0E1014; border: 1px solid #232832"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22C7F0" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">4</span></div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 18px; background: #0E1014; border: 1px solid #232832"><span style="font-size: 12px; color: #9AA3AF; font-weight: 600">STORM</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">2</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9AA3AF; font-weight: 600; letter-spacing: 0.1em"><span>VIDA POR TURNO</span><span>{{lostText}}</span></div>
    <div style="display: flex; gap: 6px; align-items: flex-end; height: 64px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span style="font-size: 12px; font-weight: 600; color: {{b.fg}}">{{b.v}}</span>
          <div style="width: 100%; height: {{b.h}}; border-radius: 6px; background: {{b.bg}}"></div>
        </div>
      </sc-for>
    </div>
  </div>

  <button onClick="{{nextTurn}}" style="height: 60px; border-radius: 30px; border: none; background: #FFB020; color: #1A1204; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Próximo turno</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { life: 15, delta: 0, hist: [20, 20, 18, 15], turn: 5, log: [] }; }
  componentWillUnmount() { clearTimeout(this.t); }
  bump(n, rec) {
    var self = this;
    var upd = { life: this.state.life + n, delta: this.state.delta + n };
    if (rec !== false) upd.log = this.state.log.concat([n]);
    this.setState(upd);
    clearTimeout(this.t);
    this.t = setTimeout(function () { self.setState({ delta: 0 }); }, 2000);
  }
  renderVals() {
    var self = this, st = this.state, d = st.delta;
    var series = st.hist.concat([st.life]).slice(-8);
    var max = Math.max.apply(null, series.concat([20]));
    return {
      life: st.life, turn: st.turn,
      hasDelta: d !== 0, deltaText: d > 0 ? '+' + d : '−' + Math.abs(d), deltaColor: d > 0 ? '#7CF0B0' : '#FF8A8A',
      lostText: 'início 20 · atual ' + st.life,
      bars: series.map(function (v, i) {
        var cur = i === series.length - 1;
        return { v: v, h: Math.max(4, Math.round(40 * Math.max(0, v) / max)) + 'px', bg: cur ? '#FFB020' : '#232832', fg: cur ? '#FFB020' : '#9AA3AF' };
      }),
      dec: function () { self.bump(-1); }, inc: function () { self.bump(1); },
      m5: function () { self.bump(-5); }, p5: function () { self.bump(5); },
      undo: function () { var l = st.log; if (!l.length) return; self.setState({ log: l.slice(0, -1) }); self.bump(-l[l.length - 1], false); },
      nextTurn: function () { self.setState({ hist: st.hist.concat([st.life]), turn: st.turn + 1 }); }
    };
  }
}
</script>
</body>
</html>
