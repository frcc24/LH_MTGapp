<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ajustes · Sinal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050608}
a{color:#FFB020;text-decoration:none}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 390px; height: 1420px; box-sizing: border-box; padding: 60px 20px 34px; background: #050608; color: #F3F5F7; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; gap: 12px; height: 56px">
    <a href="A-Home.dc.html" aria-label="Voltar" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 50%; background: #0E1014; border: 1px solid #232832; display: flex; align-items: center; justify-content: center; color: #F3F5F7"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">Ajustes</h1>
  </div>

  <a href="A-Paywall.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: #1F1806; border: 1px solid #FFB020; color: #F3F5F7">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFB020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9.5 21l1-11h3l1 11M8 21h8M10.5 10V7.5L12 6l1.5 1.5V10"></path><path d="M16 7.5l4-1.5M16 9.5l4 1.5M8 7.5L4 6M8 9.5L4 11"></path></svg>
    <div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">Lighthouse Pro</span><span style="font-size: 13px; color: #FFD27A">Sem anúncios, temas e mais · compra única</span></div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD27A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </a>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA3AF; padding-left: 4px">{{g.title}}</div>
      <div style="border-radius: 22px; background: #0E1014; border: 1px solid #232832; overflow: hidden">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; box-sizing: border-box; border-bottom: 1px solid #1A1E25">
            <div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px">{{r.label}}</span><sc-if value="{{r.hasHint}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #9AA3AF">{{r.hint}}</span></sc-if></div>
            <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ true }}">
              <button role="switch" aria-checked="{{r.on}}" aria-label="{{r.label}}" onClick="{{r.toggle}}" style="position: relative; width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; border: none; background: {{r.trackBg}}; cursor: pointer"><span style="position: absolute; top: 3px; left: {{r.knobX}}; width: 26px; height: 26px; border-radius: 50%; background: {{r.knobBg}}"></span></button>
            </sc-if>
            <sc-if value="{{r.isValue}}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #9AA3AF">{{r.value}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
            </sc-if>
            <sc-if value="{{r.isSeg}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; gap: 2px; padding: 3px; border-radius: 14px; background: #050608">
                <sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" style="height: 36px; padding: 0 10px; border-radius: 11px; border: none; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{o.label}}</button></sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 22px; background: #0E1014; border: 1px solid #232832">
    <div style="display: flex; justify-content: space-between"><span style="font-size: 16px">Tamanho do texto</span><span style="font-size: 14px; color: #9AA3AF">segue o sistema · 110%</span></div>
    <div style="display: flex; align-items: center; gap: 12px"><span style="font-size: 13px">A</span><div style="position: relative; flex-grow: 1; height: 6px; border-radius: 3px; background: #232832"><div style="width: 55%; height: 6px; border-radius: 3px; background: #FFB020"></div><div style="position: absolute; left: 55%; top: -11px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; background: #F3F5F7"></div></div><span style="font-size: 22px">A</span></div>
  </div>
  <div style="font-size: 12px; color: #7C8593; text-align: center">Lighthouse Life 1.0.0 · seus dados ficam só neste aparelho</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: { awake: true, haptic: true, sound: false, lock: false, cb: false }, theme: 0 }; }
  renderVals() {
    var self = this, st = this.state;
    function T(key, label, hint) {
      var on = st.on[key];
      return { label: label, hint: hint || '', hasHint: !!hint, isToggle: true, isValue: false, isSeg: false, on: on,
        trackBg: on ? '#FFB020' : '#232832', knobBg: on ? '#1A1204' : '#9AA3AF', knobX: on ? '23px' : '3px',
        toggle: function () { var o = Object.assign({}, st.on); o[key] = !on; self.setState({ on: o }); } };
    }
    function V(label, value, hint) { return { label: label, value: value, hint: hint || '', hasHint: !!hint, isToggle: false, isValue: true, isSeg: false }; }
    var theme = { label: 'Tema', hint: '', hasHint: false, isToggle: false, isValue: false, isSeg: true,
      opts: ['Escuro', 'Claro', 'Sistema'].map(function (l, i) { var sel = st.theme === i; return { label: l, bg: sel ? '#232832' : 'transparent', fg: sel ? '#F3F5F7' : '#9AA3AF', pick: function () { self.setState({ theme: i }); } }; }) };
    return {
      groups: [
        { title: 'Partida', rows: [T('awake', 'Tela sempre ligada', 'só durante a partida'), T('haptic', 'Vibração ao tocar'), T('sound', 'Sons'), T('lock', 'Travar orientação'), V('Contadores padrão', 'Veneno, Cmd'), V('Timer de turno padrão', 'Desligado')] },
        { title: 'Aparência', rows: [theme, T('cb', 'Modo daltônico', 'borda com traço diferente por jogador'), V('Movimento', 'Segue o sistema', 'respeita "reduzir movimento"')] },
        { title: 'Idioma', rows: [V('Idioma do app', 'Português (Brasil)')] },
        { title: 'Compras e privacidade', rows: [V('Restaurar compras', ''), V('Anúncios e rastreamento', 'Não personalizados'), V('Política de privacidade', '')] },
        { title: 'Sobre', rows: [V('Sobre o Lighthouse Life', ''), V('Enviar sugestão', '')] }
      ]
    };
  }
}
</script>
</body>
</html>
